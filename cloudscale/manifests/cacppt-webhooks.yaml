  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: cacppt-webhook-service
        namespace: syn-cluster-api
        path: /validate-controlplane-cluster-x-k8s-io-v1beta1-taloscontrolplanetemplate
