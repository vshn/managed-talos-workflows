spells:
- match: Given I have all prerequisites installed
  description: |-
    This step checks if all necessary prerequisites are installed on your system,
    including 'yq' (version 4 or higher, by Mike Farah), 'kind' and 'clusterctl'.
  run: |
    set -euo pipefail
    echo "Checking prerequisites..."

    if which yq >/dev/null 2>&1 ; then { echo "✅ yq is installed."; } ; else { echo "❌ yq is not installed. Please install yq to proceed."; exit 1; } ; fi
    if yq --version | grep -E 'version v[4-9]\.' | grep 'mikefarah' >/dev/null 2>&1 ; then { echo "✅ yq by mikefarah version 4 or higher is installed."; } ; else { echo "❌ yq version 4 or higher is required. Please upgrade yq to proceed."; exit 1; } ; fi

    if which jq >/dev/null 2>&1 ; then { echo "✅ jq is installed."; } ; else { echo "❌ jq is not installed. Please install jq to proceed."; exit 1; } ; fi

    if which kubectl >/dev/null 2>&1 ; then { echo "✅ kubectl is installed."; } ; else { echo "❌ kubectl is not installed. Please install oc to proceed."; exit 1; } ; fi

    if which vault >/dev/null 2>&1 ; then { echo "✅ vault (HashiCorp Vault) is installed."; } ; else { echo "❌ vault (HashiCorp Vault) is not installed. Please install vault to proceed."; exit 1; } ; fi

    if which curl >/dev/null 2>&1 ; then { echo "✅ curl is installed."; } ; else { echo "❌ curl is not installed. Please install curl to proceed."; exit 1; } ; fi

    if which docker >/dev/null 2>&1 ; then { echo "✅ docker is installed."; } ; else { echo "❌ docker is not installed. Please install docker to proceed."; exit 1; } ; fi

    if which commodore >/dev/null 2>&1 ; then { echo "✅ commodore (Project Syn) is installed."; } ; else { echo "❌ commodore (Project Syn) is not installed. Please install it with 'uv tool install syn-commodore && commodore tool install --missing' ."; exit 1; } ; fi

    if which python3 >/dev/null 2>&1 ; then { echo "✅ python3 is installed."; } ; else { echo "❌ python3 is not installed. Please install python3 to proceed."; exit 1; } ; fi

    if which clusterctl >/dev/null 2>&1 ; then { echo "✅ clusterctl is installed."; } ; else { echo "❌ clusterctl is not installed. Please install clusterctl (https://cluster-api.sigs.k8s.io/user/quick-start#install-clusterctl) to proceed."; exit 1; } ; fi

    if which kind >/dev/null 2>&1 ; then { echo "✅ kind is installed."; } ; else { echo "❌ kind is not installed. Please install kind (https://kind.sigs.k8s.io/docs/user/quick-start/#installing-from-release-binaries) to proceed."; exit 1; } ; fi

    if which xz >/dev/null 2>&1 ; then { echo "✅ xz is installed."; } ; else { echo "❌ xz is not installed. Please install xz to proceed."; exit 1; } ; fi

    if which age-keygen >/dev/null 2>&1 ; then { echo "✅ age-keygen is installed."; } ; else { echo "❌ age-keygen is not installed. Please install age (https://github.com/FiloSottile/age) to proceed."; exit 1; } ; fi

    echo "✅ All prerequisites are met."

- match: And a cloudscale API token
  inputs:
  - name: cloudscale_token
    type: sensitive
    description: |-
      Cloudscale API token with read+write permissions.

      Used for setting up the cluster and for the machine api provider.
  description: |-
    Create a new cloudscale API token with read+write permissions and name it
    {{ .commodore_cluster_id }} on control.cloudscale.ch/service/<your-project>/api-token.

    This step currently does not validate whether the token has write permission.
  run: |
    set -euo pipefail
    if [[ $( curl -sH "Authorization: Bearer ${INPUT_cloudscale_token}" https://api.cloudscale.ch/v1/flavors -o /dev/null -w"%{http_code}" ) != 200 ]]
    then
      echo "cloudscale token not valid!"
    fi

- match: And I set secrets in Vault
  description: |-
    This step stores the collected secrets and tokens in the Project Syn Vault.

    Additionally, the step generates some passwords from scratch.
  inputs:
  - name: vault_address
  - name: vault_login_method
  - name: commodore_cluster_id
  - name: commodore_tenant_id
  - name: bucket_user
    type: sensitive
  - name: cloudscale_token
  run: |
    set -euo pipefail

    export VAULT_ADDR=${INPUT_vault_address}
    vault login -method=${INPUT_vault_login_method}

    # Set the cloudscale.ch access secrets
    vault kv put clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/cloudscale \
      token=${INPUT_cloudscale_token} \
      s3_access_key="$(echo "${INPUT_bucket_user}" | jq -r '.keys[0].access_key')" \
      s3_secret_key="$(echo "${INPUT_bucket_user}" | jq -r '.keys[0].secret_key')"

    # Generate a master password for K8up backups
    vault kv put clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/global-backup \
      password="$(LC_ALL=C tr -cd "A-Za-z0-9" </dev/urandom | head -c 32)"

    # Generate a password for the cluster object backups
    vault kv put clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/cluster-backup \
      password="$(LC_ALL=C tr -cd "A-Za-z0-9" </dev/urandom | head -c 32)"

    # Generate a password for Grafana
    vault kv put clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/grafana \
      admin_password="$(LC_ALL=C tr -cd "A-Za-z0-9" </dev/urandom | head -c 32)"

    # Generate a per-cluster age key for etcd backups
    if ! vault kv get -field=age_private_key clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/talos-backup >/dev/null 2>&1 ; then
      age_key="$(age-keygen 2>/dev/null)"
      vault kv put clusters/kv/${INPUT_commodore_tenant_id}/${INPUT_commodore_cluster_id}/talos-backup \
        age_private_key="${age_key}" \
        age_public_key="$(echo "${age_key}" | age-keygen -y)"
    fi

- match: Then I create a cloudscale objects user and S3 buckets for the cluster
  description: |-
    Create a cloudscale objects user and setup buckets for the cluster.

    The step provisions a bucket to use during cluster bootstrap, a bucket for
    the Loki instance, and a bucket for the etcd snapshots.
  inputs:
    - name: commodore_cluster_id
    - name: cloudscale_token
    - name: csp_region
  outputs:
    - name: bucket_user
      type: sensitive
  run: |
    set -euo pipefail

    response=$(curl -sH "Authorization: Bearer ${INPUT_cloudscale_token}" \
      https://api.cloudscale.ch/v1/objects-users | \
      jq -e ".[] | select(.display_name == \"${INPUT_commodore_cluster_id}\")" ||:)
    if [ -z "$response" ]; then
      echo "Creating Cloudscale S3 user for cluster ID '${INPUT_commodore_cluster_id}'..."
      response=$(curl -sH "Authorization: Bearer ${INPUT_cloudscale_token}" \
        -F display_name=${INPUT_commodore_cluster_id} \
        https://api.cloudscale.ch/v1/objects-users)
      echo "Created user with id $(jq -n -r --argjson resp "$response" '$resp.id')"
    else
      echo "Cloudscale S3 user for cluster ID '${INPUT_commodore_cluster_id}' already exists. id: $(echo "$response" | jq -r .id)"
    fi

    echo -n "Waiting for S3 credentials to become available ..."
    until mc alias set \
      "${INPUT_commodore_cluster_id}" "https://objects.${INPUT_csp_region}.cloudscale.ch" \
      "$(jq -n -r --argjson resp "$response" '$resp.keys[0].access_key')" \
      "$(jq -n -r --argjson resp "$response" '$resp.keys[0].secret_key')"
    do
      echo -n .
      sleep 5
    done
    echo "OK"

    if [ "${INPUT_csp_region}" == "rma" ]; then
      backup_region="lpg"
    elif [ "${INPUT_csp_region}" == "lpg" ]; then
      backup_region="rma"
    else
      echo "❌ Unexpected cloudscale region '${INPUT_csp_region}'."
      exit 1
    fi

    mc alias set \
      "${INPUT_commodore_cluster_id}_backup" "https://objects.${backup_region}.cloudscale.ch" \
      "$(jq -n -r --argjson resp "$response" '$resp.keys[0].access_key')" \
      "$(jq -n -r --argjson resp "$response" '$resp.keys[0].secret_key')"

    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-bootstrap"

    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-syn-loki-chunks"

    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}_backup/${INPUT_commodore_cluster_id}-etcd-backup"

    env -i "bucket_user=$(jq -n -c --argjson user "$response" '$user')" >> "$OUTPUT"
